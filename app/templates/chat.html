{% extends "base.html" %}
{% block title %}AI Assistant — Pengo{% endblock %}

{% block head %}
<style>
:root {
    --chat-bg:   #f0f7ff;
    --bot-bg:    #ffffff;
    --user-bg:   #2563eb;
    --user-text: #ffffff;
    --bot-text:  #1e293b;
    --border:    #e2e8f0;
    --muted:     #64748b;
    --radius-lg: 1.8rem;
    --radius-sm: .6rem;
}

/* ── Layout ── */
.chat-page { min-height: 100vh; padding-top: 6rem; background: var(--chat-bg); display: flex; flex-direction: column; }
.chat-shell { max-width: 86rem; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; padding: 2.4rem 2rem 0; }

/* ── Header ── */
.chat-header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-radius: 1.6rem 1.6rem 0 0;
    padding: 2rem 2.4rem;
    display: flex; align-items: center; gap: 1.6rem;
}
.chat-avatar-lg {
    width: 5.2rem; height: 5.2rem; border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem; flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(37,99,235,.35);
}
.chat-header-info h1 { font-size: 2rem; font-weight: 800; color: #fff; margin: 0; }
.chat-header-info p  { font-size: 1.3rem; color: rgba(255,255,255,.55); margin: .2rem 0 0; }
.status-dot {
    display: inline-block; width: .85rem; height: .85rem; border-radius: 50%;
    background: #22c55e; margin-right: .5rem;
    box-shadow: 0 0 0 2px rgba(34,197,94,.3);
    animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot { 0%,100%{opacity:1}50%{opacity:.4} }

.chat-prefs-bar {
    background: #fff; border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    padding: 1rem 2.4rem; display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap;
}
.pref-chip {
    display: inline-flex; align-items: center; gap: .4rem;
    background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe;
    border-radius: 2rem; padding: .35rem 1rem; font-size: 1.2rem; font-weight: 600;
}
.pref-chip svg { width: 1.2rem; height: 1.2rem; }
.pref-label { font-size: 1.2rem; color: var(--muted); font-weight: 600; }

/* ── Messages area ── */
.chat-messages-wrap {
    flex: 1; background: #f8fafc;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 2rem 2.4rem;
    display: flex; flex-direction: column; gap: 1.4rem;
    min-height: 44rem; max-height: 56rem;
}

/* Bubbles */
.msg-row { display: flex; align-items: flex-end; gap: 1rem; max-width: 74%; }
.msg-row.bot { align-self: flex-start; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-av {
    width: 3.4rem; height: 3.4rem; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 700;
}
.msg-av.bot  { background: #1e293b; color: #fff; }
.msg-av.user { background: var(--user-bg); color: #fff; }

.msg-bubble {
    padding: 1.2rem 1.6rem; border-radius: var(--radius-lg);
    font-size: 1.45rem; line-height: 1.65;
    word-break: break-word;
}
.msg-row.bot  .msg-bubble { background: var(--bot-bg); color: var(--bot-text); border-radius: var(--radius-sm) var(--radius-lg) var(--radius-lg) var(--radius-lg); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.msg-row.user .msg-bubble { background: var(--user-bg); color: var(--user-text); border-radius: var(--radius-lg) var(--radius-sm) var(--radius-lg) var(--radius-lg); }
.msg-bubble a { color: #93c5fd; }
.msg-row.user .msg-bubble a { color: rgba(255,255,255,.8); }

/* Typing indicator */
.typing-dots { display: flex; gap: .4rem; padding: .4rem 0; }
.typing-dots span {
    width: .8rem; height: .8rem; border-radius: 50%; background: #94a3b8;
    animation: tdot 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes tdot { 0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)} }

/* Entity badges */
.entity-chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; }
.entity-chip {
    font-size: 1.1rem; font-weight: 700; padding: .25rem .8rem; border-radius: 2rem;
    background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0;
}
.entity-chip.dest   { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.entity-chip.days   { background: #fefce8; color: #92400e; border-color: #fde68a; }
.entity-chip.budget { background: #fdf4ff; color: #7e22ce; border-color: #e9d5ff; }
.entity-chip.weather{ background: #fff7ed; color: #c2410c; border-color: #fed7aa; }

/* Quick reply chips */
.qr-row { display: flex; flex-wrap: wrap; gap: .6rem; padding: 1rem 2.4rem; background: #f8fafc; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
.qr-chip {
    padding: .65rem 1.4rem; border: 1.5px solid #bfdbfe; border-radius: 2rem;
    font-size: 1.3rem; font-weight: 600; color: #1d4ed8; background: #eff6ff;
    cursor: pointer; transition: all .15s;
}
.qr-chip:hover { background: #2563eb; color: #fff; border-color: #2563eb; }

/* Input bar */
.chat-input-bar {
    background: #fff; border: 1px solid var(--border);
    border-radius: 0 0 1.6rem 1.6rem;
    padding: 1.4rem 2rem; display: flex; gap: 1rem; align-items: center;
    margin-bottom: 3.2rem;
}
.chat-input-bar input {
    flex: 1; padding: 1.2rem 1.6rem;
    border: 1.5px solid var(--border); border-radius: 2.4rem;
    font-size: 1.5rem; outline: none; background: #f8fafc;
    transition: border-color .2s, background .2s;
}
.chat-input-bar input:focus { border-color: #2563eb; background: #fff; }
.chat-send {
    width: 4.8rem; height: 4.8rem; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: 0 4px 12px rgba(37,99,235,.35);
    transition: transform .15s, box-shadow .15s;
}
.chat-send:hover { transform: scale(1.06); box-shadow: 0 6px 18px rgba(37,99,235,.45); }
.chat-send svg { width: 2rem; height: 2rem; }

/* Rating widget */
.star-row { display: flex; justify-content: center; gap: .8rem; margin-top: .8rem; }
.star-btn {
    font-size: 3rem; cursor: pointer; color: #e2e8f0;
    transition: color .15s, transform .1s; background: none; border: none; padding: 0;
}
.star-btn:hover, .star-btn.lit { color: #f59e0b; transform: scale(1.15); }
</style>
{% endblock %}

{% block content %}
<div class="chat-page">
<div class="chat-shell">

    <!-- Header -->
    <div class="chat-header">
        <div class="chat-avatar-lg">🤖</div>
        <div class="chat-header-info">
            <h1>Pengo AI Assistant</h1>
            <p><span class="status-dot"></span>Rule-based NLP · Itinerary Refinement</p>
        </div>
    </div>

    <!-- Current preferences bar -->
    <div class="chat-prefs-bar" id="prefsBar" style="display:none;">
        <span class="pref-label">Your profile:</span>
        <span class="pref-chip" id="chipBudget" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span id="labelBudget"></span>
        </span>
        <span class="pref-chip" id="chipInterests" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span id="labelInterests"></span>
        </span>
    </div>

    <!-- Messages -->
    <div class="chat-messages-wrap" id="chatMsgs"></div>

    <!-- Quick replies -->
    <div class="qr-row" id="qrRow"></div>

    <!-- Input -->
    <div class="chat-input-bar">
        <input type="text" id="msgInput" placeholder="Tell me where you want to go, your budget, interests…"
               onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="chat-send" onclick="sendMsg()" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>

</div><!-- /chat-shell -->
</div><!-- /chat-page -->
{% endblock %}

{% block scripts %}
<script>
const USER_ID   = parseInt(localStorage.getItem('user_id')) || null;
const USER_NAME = localStorage.getItem('user_name') || 'You';

/* ── Preferences bar ─────────────────────────────────────────── */
function loadPrefsBar() {
    const budget    = localStorage.getItem('budget_type');
    const interests = localStorage.getItem('interests');
    if (!budget && !interests) return;
    document.getElementById('prefsBar').style.display = 'flex';
    if (budget) {
        document.getElementById('chipBudget').style.display  = 'inline-flex';
        document.getElementById('labelBudget').textContent   = budget;
    }
    if (interests) {
        document.getElementById('chipInterests').style.display = 'inline-flex';
        document.getElementById('labelInterests').textContent  = interests;
    }
}

/* ── Message rendering ───────────────────────────────────────── */
function appendBot(html, entities) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-row bot';
    wrap.innerHTML = `<div class="msg-av bot">P</div>
        <div>
            <div class="msg-bubble" id="typing-${Date.now()}">
                <div class="typing-dots"><span></span><span></span><span></span></div>
            </div>
        </div>`;
    const msgs = document.getElementById('chatMsgs');
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;

    setTimeout(() => {
        const bub = wrap.querySelector('.msg-bubble');
        let content = html;
        if (entities) {
            const chips = buildEntityChips(entities);
            if (chips) content += `<div class="entity-chips">${chips}</div>`;
        }
        bub.innerHTML = content;
        msgs.scrollTop = msgs.scrollHeight;
    }, 650);
}

function appendUser(text) {
    const init  = USER_NAME.charAt(0).toUpperCase();
    const msgs  = document.getElementById('chatMsgs');
    const wrap  = document.createElement('div');
    wrap.className = 'msg-row user';
    wrap.innerHTML = `<div class="msg-av user">${init}</div>
        <div class="msg-bubble">${escHtml(text)}</div>`;
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
}

function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildEntityChips(entities) {
    const parts = [];
    if (entities.destination) parts.push(`<span class="entity-chip dest">📍 ${entities.destination}</span>`);
    if (entities.days)        parts.push(`<span class="entity-chip days">📅 ${entities.days} days</span>`);
    if (entities.budget_type) parts.push(`<span class="entity-chip budget">💰 ${entities.budget_type}</span>`);
    if (entities.weather_pref)parts.push(`<span class="entity-chip weather">🌤️ ${entities.weather_pref}</span>`);
    if (entities.interests && entities.interests.length)
        entities.interests.forEach(i => parts.push(`<span class="entity-chip">🎯 ${i}</span>`));
    return parts.join('');
}

/* ── Quick replies ───────────────────────────────────────────── */
const QR_MAP = {
    greet:              ['🌍 I want to go to Tokyo', '📅 5 days', '💰 My budget is mid-range', '🎯 I love food'],
    update_destination: ['📅 For 5 days', '💰 Mid-range budget', '🎯 I enjoy food & history'],
    update_days:        ['💰 Budget travel', '🎯 Nature & adventure', '📋 Plan my trip'],
    update_budget:      ['🌿 Nature', '🍜 Food & dining', '🏛️ History & culture', '✨ Relaxation'],
    update_interests:   ['📋 Generate itinerary', '💰 Change budget', '🌤️ Warm weather please'],
    update_weather:     ['📋 Generate itinerary', '🌍 Change destination'],
    generate_itinerary: ['📋 View my itinerary', '✏️ Change interests'],
    rate_itinerary:     ['📋 View my itinerary', '🌍 Plan another trip'],
    help:               ['🌍 I want to go to Paris', '💰 I prefer luxury', '🎯 I love history'],
    view_itinerary:     ['🌍 Plan a new trip', '✏️ Update preferences'],
    unknown:            ['help', '🌍 I want to visit Tokyo', '📅 3 days', '💰 Budget travel'],
};

function showQR(intent) {
    const qrRow = document.getElementById('qrRow');
    qrRow.innerHTML = '';
    const opts = QR_MAP[intent] || QR_MAP.unknown;
    opts.forEach(o => {
        const b = document.createElement('button');
        b.className   = 'qr-chip';
        b.textContent = o;
        b.onclick     = () => { qrRow.innerHTML = ''; appendUser(o); setTimeout(() => callAPI(o), 300); };
        qrRow.appendChild(b);
    });
}

/* ── API call ────────────────────────────────────────────────── */
async function callAPI(text) {
    const body = { message: text };
    if (USER_ID) body.user_id = USER_ID;

    try {
        const res  = await fetch('/api/chat', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) {
            appendBot('⚠️ Server error. Please try again.', null);
            return;
        }

        appendBot(data.reply, data.entities);
        showQR(data.intent);

        /* Sync profile bar if updates were applied */
        if (data.updates_applied) {
            if (data.entities.budget_type) {
                localStorage.setItem('budget_type', data.entities.budget_type);
                document.getElementById('chipBudget').style.display  = 'inline-flex';
                document.getElementById('labelBudget').textContent   = data.entities.budget_type;
                document.getElementById('prefsBar').style.display    = 'flex';
            }
            if (data.entities.interests && data.entities.interests.length) {
                const v = data.entities.interests.join(', ');
                localStorage.setItem('interests', v);
                document.getElementById('chipInterests').style.display = 'inline-flex';
                document.getElementById('labelInterests').textContent  = v;
                document.getElementById('prefsBar').style.display    = 'flex';
            }
        }
    } catch(e) {
        appendBot('⚠️ Connection error. Please check your network.', null);
    }
}

/* ── Send message ────────────────────────────────────────────── */
function sendMsg() {
    const inp  = document.getElementById('msgInput');
    const text = inp.value.trim();
    if (!text) return;
    document.getElementById('qrRow').innerHTML = '';
    appendUser(text);
    inp.value = '';
    setTimeout(() => callAPI(text), 200);
}

/* ── Init ────────────────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
    loadPrefsBar();
    /* Nav highlight */
    document.getElementById('nav-chat').classList.add('active');

    /* Welcome message */
    setTimeout(() => {
        appendBot(
            "Hi! I'm the Pengo Assistant. 🤖<br>" +
            "Tell me your <strong>destination</strong>, <strong>travel days</strong>, " +
            "<strong>budget</strong>, and <strong>interests</strong> — " +
            "I'll update your profile and help you plan the perfect trip.",
            null
        );
        showQR('greet');
    }, 400);
});
</script>
{% endblock %}
